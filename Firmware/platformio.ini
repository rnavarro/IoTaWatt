; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = IotaWatt
default_envs = iotawatt

[common]
lib_deps = ArduinoJson@5.13.4
	tzapu/WiFiManager@2.0.17
	https://github.com/OperatorFoundation/Crypto@^0.4.0
	https://github.com/esphome/ESPAsyncTCP.git#v2.0.0
	https://github.com/boblemaire/asyncHTTPrequest@1.2.2

[env:iotawatt]
platform = espressif8266@4.2.1
build_unflags = -Wall
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
; SdFat single-FAT card fix (backport of greiman/SdFat 2.3.1, see
; scripts/patch_sdfat_fatcount.py). Disabled until the failure is
; bench-confirmed on a single-FAT card (mkfs.fat -F 32 -f 1). NOTE:
; enabling patches the shared PlatformIO framework package; undo with
;   python3 scripts/patch_sdfat_fatcount.py --restore
; extra_scripts = pre:scripts/patch_sdfat_fatcount.py

upload_port = COM28

; Bench-test env for IPv6 validation on a bare ESP8266 dev board (no SD card).
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
lib_deps = ${common.lib_deps}
build_unflags = -Wall
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
