; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = IotaWatt
default_envs = iotawatt

[common]
lib_deps = ArduinoJson@5.13.4
	tzapu/WiFiManager@2.0.17
	https://github.com/OperatorFoundation/Crypto@^0.4.0
	https://github.com/rnavarro/ESPAsyncTCP.git#ipv6
	https://github.com/rnavarro/asyncHTTPrequest.git#fix/ipv6-literal-urls

[env:iotawatt]
platform = espressif8266@4.2.1
build_unflags = -Wall
; The -D lwIP knobs MUST stay in lockstep with the rebuilt library in
; custom_libs (scripts/build_lwip6_rdnss.sh): LWIP_NUM_NETIF_CLIENT_DATA
; changes the size of struct netif, so every translation unit has to
; agree with the library or netif accesses silently corrupt memory.
; Never set these in an env that links the stock prebuilt lwIP.
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_IPV6_HIGHER_BANDWIDTH
	-D LWIP_MDNS_RESPONDER=1
	-D LWIP_NUM_NETIF_CLIENT_DATA=1
	-L custom_libs
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
; SdFat single-FAT card fix (backport of greiman/SdFat 2.3.1, see
; scripts/patch_sdfat_fatcount.py). Failure bench-confirmed 2026-06-04:
; single-FAT card (mkfs.fat -F 32 -f 1) fails SD init on stock SdFat
; 2.1.1 while the identical fatCount=2 card mounts. NOTE: this patches
; the shared PlatformIO framework package at build time; undo with
;   python3 scripts/patch_sdfat_fatcount.py --restore
extra_scripts = pre:scripts/patch_sdfat_fatcount.py

upload_port = COM28

; Bench-test env for IPv6 validation on a bare ESP8266 dev board (no SD card).
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
lib_deps = ${common.lib_deps}
build_unflags = -Wall
; Same lockstep rule as [env:iotawatt] - see comment there.
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_IPV6_HIGHER_BANDWIDTH
	-D LWIP_MDNS_RESPONDER=1
	-D LWIP_NUM_NETIF_CLIENT_DATA=1
	-L custom_libs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
